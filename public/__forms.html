<!doctype html>
<!--
  Hidden copy of the demo-request form for Netlify Forms detection.
  Netlify only detects forms in static HTML at deploy time; the real form is rendered by React
  (src/sections/demo-request-form.tsx) and posts URL-encoded data here. Keep the field names in step with
  src/lib/demo-request.ts (checked by src/lib/demo-request.test.ts).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Forms</title>
  </head>
  <body>
    <form name="demo-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="demo-request" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="institution" />
      <select name="institutionType"></select>
      <input name="role" />
      <input name="country" />
      <textarea name="message"></textarea>
      <input name="source" />
    </form>
  </body>
</html>
