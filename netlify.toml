# Netlify build settings (these override the values in the Netlify UI).
#
# The site is a Next.js static export (output: "export" in next.config.ts), so the build output is ./out.
# @credigit/web-ui is installed from the public GitHub repo T5T-Engineering/credigit-ser-web-component,
# so no credentials are needed during `npm install`.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
