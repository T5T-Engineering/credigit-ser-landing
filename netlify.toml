# Netlify build settings (these override the values in the Netlify UI).
#
# The site is a Next.js static export (output: "export" in next.config.ts), so the build output is ./out.
#
# @credigit/web-ui is installed from the PRIVATE GitHub repo T5T-Engineering/credigit-ser-web-component.
# Netlify needs read access during `npm install`. In Site configuration → Environment variables add
# (scope: Builds, mark as secret):
#   GIT_CONFIG_COUNT   = 1
#   GIT_CONFIG_KEY_0   = url.https://x-access-token:<TOKEN>@github.com/T5T-Engineering/.insteadOf
#   GIT_CONFIG_VALUE_0 = https://github.com/T5T-Engineering/
# where <TOKEN> is a fine-grained GitHub token with read-only "Contents" access to credigit-ser-web-component.
# (Not needed if that repo is made public.)

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
